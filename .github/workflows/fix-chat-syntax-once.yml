name: One-shot chat syntax repair

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/fix-chat-duplicates.mjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fix-chat-duplicates.mjs
      - run: node --check public/modules/chat.js
      - run: npm test
      - name: Commit repair and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-chat-syntax-once.yml scripts/fix-chat-duplicates.mjs
          git add public/modules/chat.js
          git commit -m "fix(ai): remove duplicate mutation registry declarations"
          git push origin HEAD:refactor/lore-atlas-v2
