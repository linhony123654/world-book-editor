name: One-shot memory policy migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-memory-policy.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-memory-policy.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          grep -q "./ai/memory/policy.js" public/modules/chat.js
          if grep -q "const ROLLUP_EVERY = 10" public/modules/chat.js; then exit 1; fi
          if grep -q "const MEMORY_INJECTION_MAX = 8000" public/modules/chat.js; then exit 1; fi
          grep -q "planRollup(memory" public/modules/chat.js
          grep -q "createTurnMemoryRecord" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-memory-policy-once.yml scripts/migrate-memory-policy.mjs
          git add public/modules/chat.js
          git commit -m "refactor(ai): delegate memory policy and rollup planning"
          git push origin HEAD:refactor/lore-atlas-v2
