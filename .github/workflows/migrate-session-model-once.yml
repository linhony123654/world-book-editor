name: One-shot session model migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-session-model.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-session-model.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          grep -q "./ai/session/model.js" public/modules/chat.js
          if grep -q "function makeSession()" public/modules/chat.js; then exit 1; fi
          if grep -q "function normalizeMemory(m)" public/modules/chat.js; then exit 1; fi
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-session-model-once.yml scripts/migrate-session-model.mjs
          git add public/modules/chat.js
          git commit -m "refactor(ai): delegate session model semantics"
          git push origin HEAD:refactor/lore-atlas-v2
