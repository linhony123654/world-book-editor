name: One-shot tool executor migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-tool-executor.mjs
      - .github/workflows/refactor-tool-executor.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-tool-executor.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/tools/executor.js
          ! grep -q "switch (name)" public/modules/chat.js
          grep -q "ai/tools/executor.js" public/modules/chat.js
          grep -q "dispatchTool = createToolExecutor" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/chat.js
          git rm scripts/migrate-tool-executor.mjs .github/workflows/refactor-tool-executor.yml
          git commit -m "refactor(ai): route chat tools through executor boundary"
          git push origin HEAD:refactor/lore-atlas-v2
