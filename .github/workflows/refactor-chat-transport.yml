name: Refactor chat migrations

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/refactor-chat-*.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply guarded chat migrations
        run: |
          node scripts/refactor-chat-transport.mjs
          if [ -f scripts/refactor-chat-mutations.mjs ]; then node scripts/refactor-chat-mutations.mjs; fi
          if [ -f scripts/refactor-chat-tools.mjs ]; then node scripts/refactor-chat-tools.mjs; fi
          if [ -f scripts/refactor-chat-pure-ui.mjs ]; then node scripts/refactor-chat-pure-ui.mjs; fi
          if [ -f scripts/refactor-chat-read-tools.mjs ]; then node scripts/refactor-chat-read-tools.mjs; fi
      - name: Regression tests
        run: npm test
      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/chat.js public/modules/ai
          git commit -m "refactor(ai): extract read-only worldbook tools"
          git push origin HEAD:refactor/lore-atlas-v2
