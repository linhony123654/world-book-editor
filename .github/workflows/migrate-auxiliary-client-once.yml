name: One-shot auxiliary client migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-auxiliary-client.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-auxiliary-client.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/auxiliary-client.js
          grep -q "./ai/auxiliary-client.js" public/modules/chat.js
          if grep -q "const AUX_REQUEST_TIMEOUT_MS = 60000" public/modules/chat.js; then exit 1; fi
          if grep -q "async function fetchCompletion" public/modules/chat.js; then exit 1; fi
          grep -q "auxiliaryCompletionClient.complete" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-auxiliary-client-once.yml scripts/migrate-auxiliary-client.mjs
          git add public/modules/chat.js
          git commit -m "refactor(ai): delegate auxiliary completions to client"
          git push origin HEAD:refactor/lore-atlas-v2
