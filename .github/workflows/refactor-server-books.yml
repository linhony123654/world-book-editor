name: One-shot server books migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-server-books.mjs
      - .github/workflows/refactor-server-books.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare migration
        run: node scripts/migrate-server-books.mjs
      - name: Parse and focused architecture checks
        run: |
          node --check server.js
          node --check server/books-service.js
          node --check server/books-routes.js
          node --test tests/server-books-service.test.mjs tests/server-books-routes.test.mjs tests/server-books-boundary.test.mjs
      - name: Full test suite
        run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          rm scripts/migrate-server-books.mjs
          rm .github/workflows/refactor-server-books.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js server/books-service.js server/books-routes.js tests/server-books-service.test.mjs tests/server-books-routes.test.mjs tests/server-books-boundary.test.mjs scripts/migrate-server-books.mjs .github/workflows/refactor-server-books.yml
          git commit -m "refactor(server): extract books and versions"
          git push origin HEAD:refactor/lore-atlas-v2
