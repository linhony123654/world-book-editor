name: CI

on:
  push:
    branches:
      - main
      - refactor/lore-atlas-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Parse-check browser entry modules
        run: |
          node --check public/modules/chat.js
          node --check public/app.js
      - run: npm test
