name: One-shot server search migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-server-search.mjs
      - .github/workflows/refactor-server-search.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare migration
        run: node scripts/migrate-server-search.mjs
      - name: Parse and focused architecture checks
        run: |
          node --check server.js
          node --check server/search-service.js
          node --check server/search-routes.js
          node --test tests/server-search-service.test.mjs tests/server-search-routes.test.mjs tests/server-search-boundary.test.mjs
      - name: Full test suite
        run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          rm scripts/migrate-server-search.mjs
          rm .github/workflows/refactor-server-search.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js server/search-service.js server/search-routes.js tests/server-search-service.test.mjs tests/server-search-routes.test.mjs tests/server-search-boundary.test.mjs scripts/migrate-server-search.mjs .github/workflows/refactor-server-search.yml
          git commit -m "refactor(server): extract search proxy"
          git push origin HEAD:refactor/lore-atlas-v2
