name: One-shot world-book mutation migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-worldbook-mutation-tools.mjs
      - .github/workflows/refactor-worldbook-mutation.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-worldbook-mutation-tools.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/tools/worldbook-mutation.js
          grep -q "createWorldBookMutationHandlers" public/modules/chat.js
          grep -q "...mutationToolHandlers" public/modules/chat.js
          ! grep -q "function toolEdit(" public/modules/chat.js
          ! grep -q "function toolDeleteMany(" public/modules/chat.js
          ! grep -q "function toolMergeEntries(" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/chat.js tests/chat-command-boundary.test.mjs
          git rm scripts/migrate-worldbook-mutation-tools.mjs .github/workflows/refactor-worldbook-mutation.yml
          git commit -m "refactor(ai): extract world-book mutation tool adapter"
          git push origin HEAD:refactor/lore-atlas-v2
