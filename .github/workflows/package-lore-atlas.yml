name: Package Lore Atlas

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build archive
        run: |
          mkdir -p dist
          zip -qr dist/world-book-editor-lore-atlas-v2.zip . \
            -x '.git/*' '.github/workflows/package-lore-atlas.yml' 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: world-book-editor-lore-atlas-v2
          path: dist/world-book-editor-lore-atlas-v2.zip
          if-no-files-found: error
          retention-days: 1
