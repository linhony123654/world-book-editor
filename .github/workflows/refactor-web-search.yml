name: One-shot web search migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-web-search-tool.mjs
      - .github/workflows/refactor-web-search.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-web-search-tool.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/tools/web-search.js
          grep -q "web_search: webSearchTool" public/modules/chat.js
          ! grep -q "function toolWebSearch(" public/modules/chat.js
          ! grep -q "fetch('/api/proxy/search'" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/chat.js tests/chat-web-search-boundary.test.mjs
          git rm scripts/migrate-web-search-tool.mjs .github/workflows/refactor-web-search.yml
          git commit -m "refactor(ai): extract web search tool adapter"
          git push origin HEAD:refactor/lore-atlas-v2
