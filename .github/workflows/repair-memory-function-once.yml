name: One-shot memory function repair

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/repair-memory-function.mjs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/repair-memory-function.mjs
      - name: Parse and regression checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/memory/policy.js
          if grep -q '^}) {' public/modules/chat.js; then exit 1; fi
      - run: npm test
      - name: Commit repair and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-memory-function-once.yml scripts/repair-memory-function.mjs
          git add public/modules/chat.js
          git commit -m "fix(ai): remove stale memory function body"
          git push origin HEAD:refactor/lore-atlas-v2
