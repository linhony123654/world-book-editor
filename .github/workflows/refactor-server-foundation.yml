name: One-shot server foundation migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - .github/workflows/refactor-server-foundation.yml
      - scripts/migrate-server-foundation.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare migration
        run: node scripts/migrate-server-foundation.mjs
      - name: Parse and focused architecture checks
        run: |
          node --check server.js
          node --check server/database.js
          node --check server/auth.js
          node --test tests/server-database.test.mjs tests/server-auth.test.mjs tests/server-foundation-boundary.test.mjs
      - name: Full test suite
        run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/migrate-server-foundation.mjs .github/workflows/refactor-server-foundation.yml
          git add -A
          git commit -m "refactor(server): delegate database and auth foundation"
          git push origin HEAD:refactor/lore-atlas-v2
