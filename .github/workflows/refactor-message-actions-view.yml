name: One-shot message actions view migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - 'scripts/migrate-message-actions-view.mjs'
      - '.github/workflows/refactor-message-actions-view.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-message-actions-view.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/app.js
          node --check public/modules/ai/ui/message-actions-view.js
          node --check tests/message-actions-boundary.test.mjs
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/migrate-message-actions-view.mjs
          rm -f .github/workflows/refactor-message-actions-view.yml
          git add -A
          git commit -m "refactor(ai): delegate message action row presentation"
          git push origin HEAD:refactor/lore-atlas-v2
