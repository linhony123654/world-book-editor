name: Package Lore Atlas Download

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - .github/workflows/package-download.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0

      - name: Build clean source archive
        run: |
          mkdir -p dist
          zip -r dist/world-book-editor-lore-atlas-v2.zip . \
            -x '.git/*' \
               'node_modules/*' \
               'dist/*' \
               '.github/workflows/package-download.yml'

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: world-book-editor-lore-atlas-v2
          path: dist/world-book-editor-lore-atlas-v2.zip
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary packaging workflow
        run: |
          git rm .github/workflows/package-download.yml
          git config user.name "github-actions[bot]"
          git config user.email "418982b6+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary packaging workflow"
          git push origin HEAD:refactor/lore-atlas-v2
