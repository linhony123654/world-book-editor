name: One-shot book tool migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-book-tools.mjs
      - .github/workflows/refactor-book-tools.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-book-tools.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/tools/book-tools.js
          grep -q "createBookToolHandlers" public/modules/chat.js
          grep -q "...bookToolHandlers" public/modules/chat.js
          ! grep -q "function toolSwitchBook(" public/modules/chat.js
          ! grep -q "function toolDeleteBook(" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/chat.js tests/chat-book-tools-boundary.test.mjs
          git rm scripts/migrate-book-tools.mjs .github/workflows/refactor-book-tools.yml
          git commit -m "refactor(ai): extract book-level tool adapter"
          git push origin HEAD:refactor/lore-atlas-v2
