name: One-shot conversation engine migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-conversation-engine.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-conversation-engine.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/conversation/engine.js
          grep -q "runConversationTurn" public/modules/chat.js
          if grep -q "parseTextToolCalls(result.content" public/modules/chat.js; then exit 1; fi
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-conversation-engine-once.yml scripts/migrate-conversation-engine.mjs
          git add public/modules/chat.js
          git commit -m "refactor(ai): delegate tool loop to conversation engine"
          git push origin HEAD:refactor/lore-atlas-v2
