name: One-shot smart draft migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-smart-draft-tools.mjs
      - .github/workflows/refactor-smart-draft.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-smart-draft-tools.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/tools/smart-draft.js
          grep -q "createSmartDraftOrchestrator" public/modules/chat.js
          grep -q "...smartDraftOrchestrator.handlers" public/modules/chat.js
          ! grep -q "function toolCreateSmartEntry(" public/modules/chat.js
          ! grep -q "function commitSmartDraft(" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/chat.js tests/chat-smart-draft-boundary.test.mjs
          git rm scripts/migrate-smart-draft-tools.mjs .github/workflows/refactor-smart-draft.yml
          git commit -m "refactor(ai): extract smart draft orchestration"
          git push origin HEAD:refactor/lore-atlas-v2
