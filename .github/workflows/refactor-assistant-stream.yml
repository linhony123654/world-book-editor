name: One-shot assistant stream migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-assistant-stream-adapter.mjs
      - .github/workflows/refactor-assistant-stream.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-assistant-stream-adapter.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/conversation/stream-adapter.js
          grep -q "consumeAssistantStream(streamSSE(response)" public/modules/chat.js
          ! grep -q "let toolCalls = \[\]" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/chat.js tests/chat-stream-boundary.test.mjs
          git rm scripts/migrate-assistant-stream-adapter.mjs .github/workflows/refactor-assistant-stream.yml
          git commit -m "refactor(ai): extract assistant stream aggregation"
          git push origin HEAD:refactor/lore-atlas-v2
