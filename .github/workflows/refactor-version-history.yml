name: One-shot version history migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - 'scripts/migrate-version-history.mjs'
      - '.github/workflows/refactor-version-history.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-version-history.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/app.js
          node --check public/modules/chat.js
          node --check public/modules/app/version-history.js
          node --check tests/app-version-history-boundary.test.mjs
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/migrate-version-history.mjs
          rm -f .github/workflows/refactor-version-history.yml
          git add -A
          git commit -m "refactor(app): delegate version history"
          git push origin HEAD:refactor/lore-atlas-v2
