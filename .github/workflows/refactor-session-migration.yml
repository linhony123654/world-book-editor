name: One-shot legacy session migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - scripts/migrate-session-legacy-service.mjs
      - .github/workflows/refactor-session-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-session-legacy-service.mjs
      - name: Parse and architecture checks
        run: |
          node --check public/modules/chat.js
          node --check public/modules/ai/session/migration.js
          grep -q "createLegacyAiDataMigration" public/modules/chat.js
          grep -q "legacyAiDataMigration.loadSessionSeed" public/modules/chat.js
          ! grep -q "function backupCorruptData(" public/modules/chat.js
          ! grep -q "async function migrateLegacyMemory(" public/modules/chat.js
      - run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/modules/chat.js tests/chat-session-migration-boundary.test.mjs
          git rm scripts/migrate-session-legacy-service.mjs .github/workflows/refactor-session-migration.yml
          git commit -m "refactor(ai): extract legacy session migration service"
          git push origin HEAD:refactor/lore-atlas-v2
