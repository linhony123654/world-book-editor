name: One-shot app bootstrap migration

on:
  push:
    branches:
      - refactor/lore-atlas-v2
    paths:
      - .github/workflows/refactor-app-bootstrap.yml
      - scripts/migrate-app-bootstrap.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lore-atlas-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare migration
        run: node scripts/migrate-app-bootstrap.mjs
      - name: Parse and focused architecture checks
        run: |
          node --check public/app.js
          node --check public/modules/app/bootstrap.js
          node --check public/modules/app/modal-lifecycle.js
          node --test tests/bootstrap.test.mjs tests/modal-lifecycle.test.mjs tests/app-bootstrap-boundary.test.mjs
      - name: Full test suite
        run: npm test
      - name: Commit migration and remove one-shot scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/migrate-app-bootstrap.mjs .github/workflows/refactor-app-bootstrap.yml
          git add -A
          git commit -m "refactor(app): delegate bootstrap and modal lifecycle"
          git push origin HEAD:refactor/lore-atlas-v2
